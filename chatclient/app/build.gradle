 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}


dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation "javax.websocket:javax.websocket-api:1.1"
    implementation "org.glassfish.tyrus.bundles:tyrus-standalone-client:1.17"

    // JavaFX dependencies for Windows. Declared directly so the build does not
    // depend on the external OpenJFX Gradle plugin.
    implementation 'org.openjfx:javafx-base:21:win'
    implementation 'org.openjfx:javafx-controls:21:win'
    implementation 'org.openjfx:javafx-fxml:21:win'
    implementation 'org.openjfx:javafx-graphics:21:win'
    implementation 'org.openjfx:javafx-media:21:win'
    implementation 'org.openjfx:javafx-swing:21:win'
    implementation 'org.openjfx:javafx-web:21:win'
}

// Compile for Java 21 while using the JDK already installed on the local machine.
// This avoids requiring Gradle to download another JDK through the Foojay plugin.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes 'Main-Class': 'chatclient.App'
    }
}

application {
    // Define the main class for the application.
    mainClass = 'chatclient.App'
}

// Put JavaFX on the module path when running from Gradle. This replaces the
// run-time setup normally supplied by the OpenJFX Gradle plugin.
tasks.named('run', JavaExec) {
    doFirst {
        def javafxJars = classpath.filter { file ->
            file.name.startsWith('javafx-') && file.name.endsWith('-win.jar')
        }

        if (!javafxJars.isEmpty()) {
            jvmArgs '--module-path', javafxJars.asPath,
                    '--add-modules', 'javafx.controls,javafx.fxml,javafx.web,javafx.media,javafx.swing'
            classpath = classpath - javafxJars
        }
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
